name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Parent and Kid apps
        run: gradle assembleParentRelease assembleKidRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/parent/release/app-parent-release.apk out/FamilyBuzz-Parent.apk
          cp app/build/outputs/apk/kid/release/app-kid-release.apk out/FamilyBuzz-Kid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FamilyBuzz-PC.exe
        run: |
          pip install pyinstaller pystray pillow
          pyinstaller --onefile --windowed --name FamilyBuzz-PC --hidden-import pystray._win32 pc/familybuzz_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/FamilyBuzz-PC.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/FamilyBuzz-Parent.apk out/FamilyBuzz-Kid.apk out/FamilyBuzz-PC.exe \
            --title "Family Buzz build ${{ github.run_number }}" \
            --notes "Parent phones: FamilyBuzz-Parent.apk. Kids' phones: FamilyBuzz-Kid.apk. Windows PCs: FamilyBuzz-PC.exe (receives and sends)."
